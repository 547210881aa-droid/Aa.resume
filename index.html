<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Haldoren — Motion Design Portfolio</title>
  <meta name="description" content="Interactive single-screen motion design portfolio for Haldoren featuring a camera dive transition and case study showcase." />
  <meta property="og:title" content="Haldoren — Motion Design Portfolio" />
  <meta property="og:description" content="Interactive single-screen motion design portfolio for Haldoren featuring a camera dive transition and case study showcase." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>document.documentElement.classList.add('js');</script>
  <script type="module" crossorigin src="./js/app.js"></script>
  <link rel="stylesheet" crossorigin href="./css/style.css">
</head>
<body>
  <div class="stage" id="stage">
    <div class="frame d-fade" id="frame">
      <img class="plate" id="plate" src="./images/hero_studio_plate_2k.webp" alt="" referrerpolicy="no-referrer" />

      <svg class="wm pre" id="wm" viewBox="0 0 1440 260" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="wmGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
            <stop offset="0.5" stop-color="#f1f5f3" stop-opacity="0.9" />
            <stop offset="1" stop-color="#d7e6de" stop-opacity="0.28" />
          </linearGradient>
        </defs>
        <text x="14" y="214" textLength="1412" lengthAdjust="spacing" fill="url(#wmGrad)">RESUME</text>
      </svg>

      <img class="cut" id="cut" src="./images/hero_studio_cut_2k.webp" alt="Designer holding a retro phone and laptop in green studio" referrerpolicy="no-referrer" />

      <div class="badge pre" id="badge">
        <img id="badgeImg" alt="" referrerpolicy="no-referrer" />
        <div class="card">
          <h4>设计师<br>名片</h4>
          <span class="yr">2026</span>
          <div class="role">ui/ux视觉设计师</div>
          <div class="ph" id="badgePhoto">
            <img src="./images/profile_portrait.webp" alt="刘春茗" referrerpolicy="no-referrer" />
          </div>
          <div class="row"><span>姓名</span><b>刘春茗</b></div>
          <div class="row"><span>电话</span><b>15658975470</b></div>
          <div class="row"><span>微信</span><b>ltxaiZzz</b></div>
          <div class="row"><span>现居</span><b>河北廊坊</b></div>
          <div class="row"><span>邮箱</span><b>547210881@qq.com</b></div>
        </div>
        <div class="hit" id="badgeHit" aria-label="Swing designer card"></div>
      </div>

      <video class="trans" id="trans" muted playsinline preload="auto" crossorigin="anonymous"></video>

      <img class="caseplate" id="caseplate" alt="" referrerpolicy="no-referrer" />

      <div class="screen" id="screen">
        <img class="case-vid case-img" src="./images/portfolio/dd_cover.webp" alt="叮咚买菜 鲜叮咚 够葡喜 3D 运营主视觉" referrerpolicy="no-referrer" />
        <img class="case-vid case-img case-img-contain" src="./images/portfolio/wy_cover.webp" alt="窝友自驾 UX 项目展示" referrerpolicy="no-referrer" />
        <div class="case-vid case-holo" id="holoStage"></div>
        <div class="flash" id="flash"></div>
      </div>

      <div class="screen-hit" id="screenHit" role="button" tabindex="-1" aria-label="Next case"></div>
    </div>
  </div>

  <div class="ui">
    <button class="tag t1 pre" id="btnStudio" type="button">个人信息</button>
    <button class="tag t2 pre" id="btnPortfolio" type="button">运营项目</button>
    <button class="tag t3 pre" id="btnContacts" type="button">ux项目</button>
    <button class="tag t4 pre" id="btnDiscuss" type="button">生活切片</button>

    <button class="logo" id="btnLogo" type="button">刘春茗</button>

    <svg class="m-only m-wm pre" id="mWm" viewBox="0 0 1440 240" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="mWmGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="0.5" stop-color="#f1f5f3" stop-opacity="0.9" />
          <stop offset="1" stop-color="#d7e6de" stop-opacity="0.3" />
        </linearGradient>
      </defs>
      <text x="10" y="210" textLength="1420" lengthAdjust="spacing" fill="url(#mWmGrad)">RESUME</text>
    </svg>

    <div class="m-only m-badge" id="mBadge"></div>

    <div class="ticket" id="ticket" aria-live="polite">
      <span class="hole tl"></span>
      <span class="hole tr"></span>
      <span class="hole bl"></span>
      <span class="hole br"></span>
      <h2 id="ticketTitle">运营项目</h2>
      <div class="rows" id="ticketRows">
        <div>叮咚买菜</div>
        <div>3D 运营主视觉</div>
        <div>2026</div>
      </div>
    </div>

    <div class="desc" id="desc">
      <div class="k" id="descKey">// 鲜叮咚 够葡喜</div>
      <p id="descText">— 以毛毡质感小鸡 IP 与生鲜花市微缩场景为核心，打造高辨识度叮咚买菜运营主视觉画面。</p>
      <div class="num" id="descNum">01 / 03</div>
    </div>

    <button class="nav-case prev dim" id="btnPrev" type="button">
      <span class="c">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M11 6l-6 6 6 6" />
        </svg>
      </span>
      <span>previous <br>case</span>
    </button>

    <button class="nav-case next" id="btnNext" type="button">
      <span class="c">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
      <span>next <br>case</span>
    </button>

    <div class="hint pre" id="hint">
      <span class="line"><i></i></span>
      <span>下滑探索作品</span>
    </div>
  </div>

  <div class="badge-zoom" id="badgeZoom" role="dialog" aria-modal="true" aria-hidden="true" aria-label="个人信息名片">
    <button class="badge-zoom-close" id="badgeZoomClose" type="button" aria-label="关闭个人名片">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>
    <div class="badge-zoom-stage" id="badgeZoomStage"></div>
  </div>

  <div class="case-viewer" id="caseViewer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="叮咚买菜完整作品集">
    <button class="case-viewer-close" id="caseViewerClose" type="button" aria-label="关闭作品集">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>
    <div class="case-viewer-track" id="caseViewerTrack"></div>
  </div>

</body>
</html>
